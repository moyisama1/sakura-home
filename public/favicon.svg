<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="petalGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffd6e7"/>
      <stop offset="60%" stop-color="#ff9ec7"/>
      <stop offset="100%" stop-color="#ff6ba8"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3a0"/>
      <stop offset="100%" stop-color="#ffc94d"/>
    </radialGradient>
  </defs>
  <!-- 5片花瓣 -->
  <g transform="translate(32,32)">
    <!-- 花瓣1 -->
    <g transform="rotate(0)">
      <ellipse cx="0" cy="-14" rx="9" ry="16" fill="url(#petalGrad)" opacity="0.95"/>
      <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#ffb8d6" opacity="0.5"/>
    </g>
    <!-- 花瓣2 -->
    <g transform="rotate(72)">
      <ellipse cx="0" cy="-14" rx="9" ry="16" fill="url(#petalGrad)" opacity="0.95"/>
      <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#ffb8d6" opacity="0.5"/>
    </g>
    <!-- 花瓣3 -->
    <g transform="rotate(144)">
      <ellipse cx="0" cy="-14" rx="9" ry="16" fill="url(#petalGrad)" opacity="0.95"/>
      <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#ffb8d6" opacity="0.5"/>
    </g>
    <!-- 花瓣4 -->
    <g transform="rotate(216)">
      <ellipse cx="0" cy="-14" rx="9" ry="16" fill="url(#petalGrad)" opacity="0.95"/>
      <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#ffb8d6" opacity="0.5"/>
    </g>
    <!-- 花瓣5 -->
    <g transform="rotate(288)">
      <ellipse cx="0" cy="-14" rx="9" ry="16" fill="url(#petalGrad)" opacity="0.95"/>
      <ellipse cx="0" cy="-14" rx="5" ry="10" fill="#ffb8d6" opacity="0.5"/>
    </g>
    <!-- 花心 -->
    <circle cx="0" cy="0" r="6" fill="url(#centerGrad)"/>
    <!-- 花蕊 -->
    <g stroke="#e8873d" stroke-width="1.2" stroke-linecap="round">
      <line x1="0" y1="-3" x2="0" y2="-10"/>
      <line x1="-3" y1="-1.8" x2="-8" y2="-5"/>
      <line x1="3" y1="-1.8" x2="8" y2="-5"/>
      <line x1="-3" y1="1.8" x2="-8" y2="5"/>
      <line x1="3" y1="1.8" x2="8" y2="5"/>
      <line x1="0" y1="3" x2="0" y2="10"/>
    </g>
  </g>
</svg>
